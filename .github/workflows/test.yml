# The checks every change must pass, called by ci.yml: formatting, lints, the library docs, the unit
# and property tests and the black-box regression suite (tests/: the binary as a process against a scripted StackSpot),
# the leak check, and the dependency policy (advisories, licenses, sources: deny.toml).
name: test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # installs the toolchain and components of rust-toolchain.toml, and caches the build
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
      - name: Pins (actions by commit, runners by version, the image's Rust is rust-toolchain.toml's)
        run: |
          if grep -rnE '^\s*(- )?uses: [^.][^@]*@' .github/workflows | grep -vE '@[0-9a-f]{40}( |$)'; then
            echo "::error::pin every action to a full commit SHA (the version goes in a comment)"; exit 1
          fi
          if grep -rnE 'ubuntu-lat[e]st' .github/workflows; then
            echo "::error::name the runner's version (ubuntu-24.04): -latest moves to a new release on GitHub's schedule"; exit 1
          fi
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          grep -qE "^FROM rust:${channel}-alpine[@ ]" docker/Dockerfile || {
            echo "::error::docker/Dockerfile builds with another Rust than rust-toolchain.toml (${channel})"; exit 1; }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
      - run: cargo doc --no-deps --package midir --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace --profile ci --locked
      - run: cargo xtask check-leaks

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources
