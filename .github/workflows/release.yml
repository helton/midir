# A push to main is a release: the version in Cargo.toml is published as ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y and
# :latest (amd64 and arm64), then tagged vX.Y.Z with a GitHub release whose notes are that version's section of
# docs/CHANGELOG.md. A push to main whose version was already released publishes nothing (bump it on develop first).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"   # [package] comes first
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::v$version is already released; nothing to publish (bump the version on develop to release)"
          elif ! grep -q "^## $version " docs/CHANGELOG.md; then
            echo "::error::docs/CHANGELOG.md has no '## $version' section"; exit 1
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/test.yml

  image:
    needs: [check, test]
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      channel: release
      push: true
      tags: |
        type=semver,pattern={{version}},value=v${{ needs.check.outputs.version }}
        type=semver,pattern={{major}}.{{minor}},value=v${{ needs.check.outputs.version }}
        type=raw,value=latest

  github-release:
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag vX.Y.Z and publish the release notes from docs/CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## "v" " {f=1; next} /^## / && f {exit} f' docs/CHANGELOG.md > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
