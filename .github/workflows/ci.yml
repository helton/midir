name: ci

# develop: tests + snapshot image. Pull requests: tests + image build (not pushed). main is handled by release.yml.
on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --no-default-groups --group test   # the test group only; poethepoet is a dev tool
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python scripts/check_leaks.py

  # Snapshots: every push to develop publishes ghcr.io/<owner>/<repo>:dev (the latest develop build; may break) and
  # :sha-<commit> (fixed), for amd64 and arm64, once the tests pass. Pull requests only build the image.
  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index   # multi-arch: ghcr shows the index's description
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=midir
            org.opencontainers.image.description=Midir: OpenAI- and Anthropic-compatible gateway for LLM backends (StackSpot AI agents today)
          annotations: |
            org.opencontainers.image.title=midir
            org.opencontainers.image.description=Midir: OpenAI- and Anthropic-compatible gateway for LLM backends (StackSpot AI agents today)
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ env.PUBLISH == 'true' && steps.meta.outputs.annotations || '' }}   # index annotations only for the pushed multi-arch image
          cache-from: type=gha
          cache-to: type=gha,mode=max
