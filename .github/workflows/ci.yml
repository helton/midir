name: ci

# develop: tests + snapshot image. Pull requests: tests + image build (not pushed). main is handled by release.yml.
on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Snapshots: every push to develop publishes ghcr.io/<owner>/<repo>:dev (the latest develop build; may break) and
  # :sha-<commit> (fixed), for amd64 and arm64, once the tests pass. Pull requests only build the image.
  image:
    needs: test
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      channel: dev
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
      tags: |
        type=raw,value=dev
        type=sha,prefix=sha-,format=short
