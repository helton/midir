# Weekly update proposals for the Rust dependencies, the GitHub Actions and the Docker base images. Pull requests target
# develop (where work happens); main only receives releases.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker
    target-branch: develop
    schedule:
      interval: weekly
