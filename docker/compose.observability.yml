# Observability overlay for compose.yml: mitmproxy in front of and behind the gateway, Grafana LGTM for telemetry.
#
#   docker compose -f docker/compose.yml -f docker/compose.observability.yml up -d --remove-orphans
#   (from the repository root; add -f docker/compose.build.yml to build from source)
#
#   18880  clients  -> mitmproxy (reverse) -> gateway        same URL as standalone, so clients do not change
#   18881  gateway directly, bypassing mitmproxy
#   18882  mitmweb  http://127.0.0.1:18882/?token=gateway
#   18883  Grafana  http://127.0.0.1:18883  (dashboard "midir", no login, bound to 127.0.0.1)
#   18884  OTLP/HTTP, for a gateway running outside Docker
#
# The gateway reaches StackSpot through mitmproxy's regular proxy, so upstream calls are visible too. Telemetry never
# carries prompt content. Data lives in docker/data/mitm (proxy) and docker/data/lgtm (Grafana/Prometheus/Tempo).

services:
  midir:
    ports: !override
      - "127.0.0.1:18881:18880"
    environment:
      # lowercase on purpose: Python (httpx) prefers https_proxy/no_proxy over the uppercase names, and Docker setups
      # with a proxy configured (e.g. at work) inject lowercase values that would otherwise win over these
      https_proxy: http://mitm:8080
      no_proxy: lgtm,mitm,localhost,127.0.0.1
      STACKSPOT_CA_BUNDLE: /certs/mitm/mitmproxy-ca-cert.pem
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    volumes:
      - ./data/mitm:/certs/mitm:ro         # mitmproxy CA (generated by the mitm service on first start), read-only
    depends_on:
      mitm:
        condition: service_healthy
      lgtm:
        condition: service_started

  mitm:
    container_name: midir-mitm
    image: mitmproxy/mitmproxy:12
    user: "0:0"
    command: >
      mitmweb --no-web-open-browser
      --set confdir=/data/mitm
      --set web_host=0.0.0.0 --set web_port=18882 --set web_password=gateway
      --mode reverse:http://midir:18880@18880
      --mode regular@8080
      -s /addons/sse_stream.py
    ports:
      - "127.0.0.1:18880:18880"
      - "127.0.0.1:18882:18882"
    volumes:
      - ./data/mitm:/data/mitm   # the proxy's own data only (CA and config)
      - ./mitm/sse_stream.py:/addons/sse_stream.py:ro   # streams SSE through instead of buffering it (keepalives, tokens)
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 18882), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  lgtm:
    container_name: midir-lgtm
    image: grafana/otel-lgtm:latest
    ports:
      - "127.0.0.1:18883:3000"
      - "127.0.0.1:18884:4318"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      ENABLE_LOGS_ALL: "false"
    volumes:
      - ./grafana/midir-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/midir.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/midir-dashboards:ro
      - ./data/lgtm:/data
    restart: unless-stopped
