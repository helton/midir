# Repository tasks (`cargo xtask <task>`, alias in .cargo/config.toml): version bump, leak check, live smoke test,
# local deploys. A workspace member so it needs no extra tool; it is never part of the release binary or image.
[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
