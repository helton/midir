# midir.toml: the whole configuration of Midir. Copy to config/midir.toml (read from the working directory, or from
# MIDIR_CONFIG=<path>). Values may reference environment variables as ${NAME}; keep secrets in .env and reference them
# here. An environment variable with the same meaning always wins over this file (`midir --help` lists them).

default_model = "gpt-5.1"   # model used when the requested one matches nothing (default: the first model below)

[server]
port = 18880
max_prompt_chars = 1000000   # above this, oldest turns are dropped, then the largest tool results cut (StackSpot: 272k tokens max)
tail_reminder = true         # one-line tool-protocol reminder after the last turn (fewer "announce and stop" replies)
tool_desc_max = 0            # truncate tool descriptions to N chars (0 = off): ~12% fewer input tokens, alters what clients send
tool_schema = "json"         # how tools are listed: "json" (their JSON Schemas) or "compact" (a line per parameter; same
                             # descriptions, ~10% fewer tokens in a large tool listing such as Copilot's)
followups = true             # hidden follow-ups for replies that announce an action without its call, deny an ability a
                             # tool provides, or forget an ordered commit (false = the reply is returned as the model wrote it)
keepalive_s = 15             # an idle stream gets an SSE keepalive this often (0 = off)
read_timeout_s = 30          # a request's headers must arrive within this; its body may not stall longer between chunks
responses_dir = "data/gateway/responses"   # previous_response_id store (one small file per response, owner-only); "" = memory only
responses_retention_days = 30   # fixed from creation; purged hourly; a later previous_response_id to a purged response gets a 404
responses_max_mb = 500          # above this, blobs no response uses go first, then the oldest responses
responses_memory_mb = 64        # memory cache of stored responses (least recently used out first; misses are read from disk)
shutdown_grace_s = 25           # on SIGTERM, how long in-flight requests (streams) get to finish
retry_backoff_s = 1             # first wait before retrying a backend 429 or 5xx (doubles each attempt)
# api_key = "${MIDIR_API_KEY}"  # when set, clients must send it (Authorization: Bearer <key> or x-api-key); /health and /ready stay open

[telemetry]
# otlp_endpoint = "http://127.0.0.1:18884"   # unset = nothing exported, no cost; the compose overlay sets it by env
service_name = "midir"
prometheus = false                           # GET /metrics in Prometheus format, for setups without an OTLP collector

# ---- backends: what serves the models (one today: StackSpot AI agents, docs/backends/stackspot.md) ----

[backends.stackspot]
type = "stackspot"
realm = "${STACKSPOT_REALM}"
client_id = "${STACKSPOT_CLIENT_ID}"
client_secret = "${STACKSPOT_CLIENT_SECRET}"
# ca_bundle = "/etc/ssl/certs/corporate-ca.pem"                      # a CA the system store lacks (corporate TLS)
# idm_base_url = "https://idm.stackspot.com"                        # only for local mocks and tests
# agent_base_url = "https://genai-inference-app.stackspot.com/v1/agent"

[backends.stackspot.limits]
# In-memory queue in front of the backend (StackSpot allows 100 requests/minute per account, shared by every agent and
# client). Requests wait here instead of failing with 429; every backend call counts (follow-ups and retries included).
# The MIDIR_MAX_CONCURRENT / MIDIR_REQUESTS_PER_MINUTE / MIDIR_QUEUE_TIMEOUT / MIDIR_COOLDOWN_ON_429 variables override
# these for every backend.
max_concurrent = 8          # open backend calls at once
requests_per_minute = 90    # request starts in any 60 s window; keep a margin below 100 (halved after a 429, recovers 1/min)
queue_timeout_s = 600       # longest wait for a slot before answering 429 (background agents tolerate long waits)
cooldown_on_429_s = 15      # pause new starts after a backend 429 (other clients of the account use the quota too)
max_waiting = 64            # requests waiting for a slot at once; beyond it a new one gets a 429 with Retry-After at once

# ---- models: what clients see ----
# Routing for a requested model, in order: exact name or alias (case-insensitive) > `match` regex (file order) > exact
# after stripping a provider prefix ("openai/", "stackspot-", "midir-") > longest configured name contained in the
# requested one ("stackspot-gpt-4.1" -> gpt-4.1) > default_model. `backend` may be omitted while there is one backend;
# `target` is what the backend serves (StackSpot: the agent id). Per-model knobs inherit [server] when omitted.

[[models]]
name = "gpt-5.1"
backend = "stackspot"
target = "${STACKSPOT_GPT_5_1_AGENT_ID}"
description = "GPT 5.1: long autonomous tasks (planner Simple, minimal system prompt)"
aliases = ["claude-opus-4-1", "claude-opus-4-5"]   # Claude model names some clients send by default
# match = "^(openai/)?gpt-5"                          # optional regex
# max_prompt_chars = 1000000
# tail_reminder = true
# tool_desc_max = 0
# tool_schema = "json"
# followups = true

[[models]]
name = "gpt-4.1"
backend = "stackspot"
target = "${STACKSPOT_GPT_4_1_AGENT_ID}"
description = "GPT 4.1: interactive work, 4-5x faster, half the input tokens; may stop before the last step of a long task"
aliases = ["claude-haiku-4-5", "claude-3-5-haiku"]

[[models]]
name = "flex"
backend = "stackspot"
target = "${STACKSPOT_FLEX_AGENT_ID}"
description = "StackSpot Flex (GPT 4.1 with StackSpot's own system prompt): everyday agent work, about 2x faster than gpt-5.1"
aliases = ["claude-sonnet-4-5", "claude-sonnet-4-6"]
